name: Build and Push FastAPI to AWS ECR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 1. AWS 자격 증명 설정
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 2. AWS ECR 로그인
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 레포지토리가 없으면 생성
    - name: Check or Create ECR Repository
      env:
        ECR_REPOSITORY: hong-community-be
      run: |
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY || \
        aws ecr create-repository --repository-name $ECR_REPOSITORY \
          --image-scanning-configuration scanOnPush=true \
          --encryption-configuration encryptionType=AES256
        echo "Repository is ready."

    # 3. Docker 이미지 빌드 및 푸시
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hong-community-be # AWS ECR에 미리 만들어둔 레포지토리 이름
        IMAGE_TAG: ${{ github.sha }}   # 커밋 해시값을 태그로 사용 (버전 관리 용이)
      run: |
        # 이미지 빌드 (플랫폼 명시 권장)
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # ECR로 푸시
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 4. EC2에 SSM으로 배포 명령 전달
    - name: Deploy to EC2 via SSM
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hong-community-be
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            'echo \"Logging in to ECR...\"',
            'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY',
            'echo \"Pulling latest image...\"',
            'docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest',
            'echo \"Stopping and removing old container...\"',
            'docker stop fastapi-app || true',
            'docker rm fastapi-app || true',
            'echo \"Starting new container...\"',
            'docker run -d --name fastapi-app -p 80:8000 $ECR_REGISTRY/$ECR_REPOSITORY:latest',
            'echo \"Cleanup unused images...\"',
            'docker image prune -f'
          ]" \
          --region ${{ secrets.AWS_REGION }}

    # 5. Kubernetes (EKS) 배포
    - name: Deploy to Kubernetes
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hong-community-be
        IMAGE_TAG: ${{ github.sha }}
        CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      run: |
        # Kubeconfig 설정 (EKS 클러스터 연결)
        aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ secrets.AWS_REGION }}
        
        # K8s 매니페스트 적용 (Deployment, Service)
        kubectl apply -f 2-hong-community-be/k8s/
        
        # 새로 빌드된 특정 태그 이미지로 업데이트 (롤링 업데이트 트리거)
        kubectl set image deployment/community-be community-be=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # 배포 상태 확인
        kubectl rollout status deployment/community-be