name: Build and Push FastAPI to AWS ECR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # 1. AWS 자격 증명 설정
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 2. AWS ECR 로그인
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 레포지토리가 없으면 생성
    - name: Check or Create ECR Repository
      env:
        ECR_REPOSITORY: hong-community-be
      run: |
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY || \
        aws ecr create-repository --repository-name $ECR_REPOSITORY \
          --image-scanning-configuration scanOnPush=true \
          --encryption-configuration encryptionType=AES256
        echo "Repository is ready."

    # 3. Docker 이미지 빌드 및 푸시
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hong-community-be # AWS ECR에 미리 만들어둔 레포지토리 이름
        IMAGE_TAG: ${{ github.sha }}   # 커밋 해시값을 태그로 사용 (버전 관리 용이)
      run: |
        # 이미지 빌드 (플랫폼 명시 권장)
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # ECR로 푸시
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # 4. EC2에 SSM으로 배포 명령 전달 (Standalone Docker + K8s Pods)
    - name: Deploy to EC2 and K8s via SSM
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hong-community-be
        IMAGE_TAG: ${{ github.sha }}
        INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      run: |
        # K8s YAML 파일 내용을 변수로 가져오기 (매니페스트 전달용)
        DEPLOYMENT_YAML=$(cat 2-hong-community-be/k8s/deployment.yaml | sed "s|<AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/hong-community-be:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g")
        SERVICE_YAML=$(cat 2-hong-community-be/k8s/service.yaml)

        # SSM을 통해 EC2에서 실행할 명령어 조립
        aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            'echo \"1. Logging in to ECR...\"',
            'aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY',
            
            'echo \"2. Standalone Docker Deployment...\"',
            'docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest',
            'docker stop fastapi-app || true',
            'docker rm fastapi-app || true',
            'docker run -d --name fastapi-app -p 80:8000 $ECR_REGISTRY/$ECR_REPOSITORY:latest',
            
            'echo \"3. K8s (on EC2) Deployment...\"',
            'mkdir -p ~/k8s-deploy',
            'echo \"$DEPLOYMENT_YAML\" > ~/k8s-deploy/deployment.yaml',
            'echo \"$SERVICE_YAML\" > ~/k8s-deploy/service.yaml',
            'kubectl apply -f ~/k8s-deploy/deployment.yaml',
            'kubectl apply -f ~/k8s-deploy/service.yaml',
            'kubectl rollout status deployment/community-be',
            
            'echo \"4. Cleanup...\"',
            'docker image prune -f'
          ]" \
          --region ${{ secrets.AWS_REGION }}